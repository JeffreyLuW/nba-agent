# CI: runs on every pull request and on pushes to nprd (staging) and main (production).
name: CI

on:
  pull_request:
  push:
    branches: [nprd, main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt -r backend/requirements.txt
      - name: Lint
        run: ruff check .
      - name: Check that the code imports
        run: |
          cd backend && python -c "import app.agent, app.main"
          cd ../mcp_server && python -c "import server"
      - name: Unit tests (NBA.com and the LLM are mocked, so no network needed)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Type check (catches bugs like using a variable before it exists)
        run: npm run typecheck
      - run: npm run build

  # TODO: an "evals" job (needs an LLM), and deploy jobs (nprd -> staging, main -> production).
